# anon-proxy 配置示例：复制成 config.toml 再改。
# 只给自己用就保持 127.0.0.1；要让别人连进来改成 "0.0.0.0:8787"，并且一定要配好 [users]。
listen = "127.0.0.1:8787"

# ---- 虚拟 Provider 模式（推荐）：无论下游用 Codex (/v1/responses)、开源客户端 (/v1/chat/completions)
#      还是 Anthropic SDK (/v1/messages) 打进来，统一洗成完全一致的标准 Claude /v1/messages 请求发给上游 ----
[provider]
# "anthropic"：所有下游协议统一转译到 Anthropic Claude；留空 "" 则按原始协议分别转发给 OpenAI / Anthropic
target = "anthropic"
# 下游传非 claude 模型名（如 Codex 默认的 gpt-5.1 或 anon-coder）时映射到的上游模型
default_model = "claude-opus-5-5"
# true：即使下游指定了别的 claude-* 模型名，也一律改写成 default_model，消除模型名差异
force_model = false
# 按模型名精确映射（可选），如 { "codex-mini" = "claude-sonnet-4-20250514" }
model_map = {}
# 下游未传 max_tokens 时的默认值
default_max_tokens = 16384
# "auto"：下游带 reasoning/thinking 时开启 Claude adaptive thinking；"adaptive"：始终开启；"off"：始终关闭
thinking_mode = "auto"
# 剥离客户端自带的 anthropic-beta（避免暴露客户端身份），只保留网关自身需要的功能性 beta
strip_client_betas = true
# 清洗系统提示词里的客户端自报家门（如 "running in the Codex CLI... led by OpenAI" 及内置 .system 技能）
sanitize_system = true

# ---- 上游：你自己的商业 API key，优先读环境变量，也可读 api_key_file ----
[upstream.anthropic]
base_url = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"
# 也可以把 key 放进文件（相对本配置文件的目录），环境变量没设时读它；每次请求现读，换 key 不用重启
# api_key_file = "key.txt"
# 统一使用中性标准 SDK UA（不要填 claude-cli/...，否则普通请求也会被上游当成交互式 Claude Code）
user_agent = "Anthropic/Python 0.52.0"

[upstream.openai]
# 仅在 provider.target = "" 时使用
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
user_agent = "OpenAI/Python 1.60.0"

[network]
# 访问上游需要走代理时填写（支持 http://user:pass@host:port）；不填则读 HTTPS_PROXY 环境变量
# upstream_proxy = "http://127.0.0.1:7890"
timeout_seconds = 900

[privacy]
# 生成伪名和替身用的 HMAC 密钥，首次启动自动生成。别泄露，也别随便换（换了会让提示缓存失效）
secret_file = "data/secret.key"
# 加密持久化每个用户的替身映射与历史冻结缓存（重启网关后继续旧会话也不会触发 thinking_dropped）；留空则只放内存
vault_dir = "data/vaults"
# "none"：不给上游任何终端用户标识（默认）。
# "pseudonym"：每个下游用户一个稳定的不可逆伪名（safety_identifier / metadata.user_id）。
end_user_id = "none"
# Responses API 一律 store=false（passthrough OpenAI 时生效）
force_store_false = true
# 去掉写在 system 第一段里的 x-anthropic-billing-header
strip_billing_header = true
# 去掉客户端（如 Claude Code）启动时静默塞进 <system-reminder> 的 git 分支与最近 commit 快照
strip_silent_git = true
# Opus 5.5 / Fable 5.x 会校验回传的 thinking 块前面的历史是否被改过。"drop_block"：万一对不上，
# 只丢弃那些 thinking 块继续回答；"error"：直接报错；"off"：不改动请求
thinking_mismatch = "drop_block"
# Codex 会把本机时区与本机日期写进 <environment_context>，这里统一改成同一台目标机器的时区（<current_date> 也会同步按该时区计算）；留空则不改
timezone = "Australia/Sydney"
# 填一个目录，就把每个发往上游的请求（脱敏后、key 已隐去）存一份，用来核查上游到底看到了什么
audit_dir = ""

[masking]
# "natural"：拟真替身（alex_mercer9f2a / tok_test_... / nimbus-labs-9f2），消除“一眼脱敏”特征；
# "tagged"：传统标签式替身（user1a2b3c4d / SECRET_...）
surrogate_style = "natural"
secrets = true          # API key、token、私钥、password=xxx 这类赋值
entropy_secrets = true  # 香农熵兜底检测：抓没有固定前缀的高熵随机密钥（自动跳过 git SHA、UUID 和普通变量名）
emails = true
ips = true              # 回环/保留地址不动
path_usernames = true   # C:\Users\<名字>、/Users/<名字>、/home/<名字>，学到的名字会在全文替换
mask_cwd = true         # 自动将静默采集的 <cwd> / Working directory 项目目录名替换为 workspace_xxxxxx 并可逆还原
normalize_os_version = true  # 将静默采集的精确内核版本（如 OS Version: Darwin 25.6.0）统一为通用固定值
hostnames = true        # DESKTOP-XXXXXXX、xxx-MacBook-Pro.local
git_remotes = true      # github.com/<组织>/<仓库> 等
# 一定要脱敏的字面量：真名、公司名、内部域名、项目代号……（不区分大小写）
literals = []
# 不脱敏的值（不区分大小写）
keep = ["git@github.com", "noreply@github.com", "noreply@anthropic.com", "8.8.8.8", "8.8.4.4", "1.1.1.1", "1.0.0.1"]

# ---- 下游用户：网关 key = 别名。用 `python3 -m anon_proxy keygen 别名` 生成一行贴进来 ----
[users]
# "gk-把这里换成生成的key" = "alice"
